<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0F0F0E"/>
  <!-- 360° arm — simplified camera arm arc -->
  <path d="M8 20 A10 10 0 0 1 24 20" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Platform circle -->
  <ellipse cx="16" cy="21" rx="6" ry="2" stroke="white" stroke-width="2" fill="none"/>
  <!-- Camera dot at tip of arm -->
  <circle cx="24" cy="20" r="2" fill="white"/>
</svg>
